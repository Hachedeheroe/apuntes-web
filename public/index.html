<style>
/* ---------------------------------------------------------------------------
   Cuaderno de laboratorio — papel de cuadros, tinta, lápiz y subrayador.
   El filete deja de decorar y pasa a medir: la regla graduada es la pieza
   que cose portada, asignaturas y archivo de la PAU.
--------------------------------------------------------------------------- */
:root{
  --papel:#edefe7; --tinta:#191c1a; --grafito:#5e6560;
  --cuadro:#c9d2c4; --boli:#1e3fa8; --rotu:#e4f23f;
  --sup:#e5e8de; --marca:multiply; --marca-bg:var(--rotu); --rotu-fila:34%;
  /* Alias del sistema anterior: cualquier estilo heredado sigue en paleta. */
  --pg:var(--papel); --ink:var(--tinta); --rule:var(--cuadro);
  --fuerte:var(--tinta); --sut:var(--grafito); --acc:var(--boli);
  --shadow-sm:0 1px 0 var(--cuadro);
  --shadow-md:0 6px 18px color-mix(in srgb,#191c1a 10%,transparent);
  --shadow-lg:0 18px 44px color-mix(in srgb,#191c1a 18%,transparent)}
[data-tema="oscuro"]{
  --papel:#15181a; --tinta:#e7eae2; --grafito:#98a29a;
  --cuadro:#2c332e; --boli:#8faeff; --rotu:#e4f23f;
  --sup:#1b1f20; --marca:normal; --marca-bg:color-mix(in srgb,var(--rotu) 26%,transparent); --rotu-fila:15%;
  --shadow-md:0 6px 18px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.62;
  font-optical-sizing:auto;transition:background .25s ease,color .25s ease}
a{color:var(--boli);text-underline-offset:3px}
a:hover{color:var(--boli);text-decoration:underline}
:focus-visible{outline:2px solid var(--boli);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--rotu) 60%,transparent);color:var(--tinta)}
/* --------------------------------------------------------- tipografía -- */
/* Regla del sistema: lo que se mide va en monoespaciada (cifras, etiquetas,
   títulos cortos); lo que se lee va en la serif (prosa y títulos largos). */
.mono,.anot,.cifra,.et{font-family:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.anot{font-size:11px;font-weight:400;line-height:1.5;color:var(--grafito);letter-spacing:-.02em}
.anot-acc{color:var(--boli)}
.cifra{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.04em}
h1,h2,h3,h4{text-wrap:balance}
.t-mono{font-family:"Martian Mono",ui-monospace,monospace;font-weight:800;letter-spacing:-.035em;line-height:1}
.t-serif{font-family:"Newsreader",Georgia,serif;font-weight:600;letter-spacing:-.015em;line-height:1.05}
/* ------------------------------------------------ la regla graduada -- */
/* Filete con graduación: marca menor cada 12px y mayor cada 60px. */
.regla{height:14px;border-bottom:1.5px solid var(--tinta);background-repeat:repeat-x;
  background-position:left bottom;background-size:auto 11px,auto 5px;
  background-image:repeating-linear-gradient(90deg,var(--tinta) 0 1px,transparent 1px 60px),
    repeating-linear-gradient(90deg,color-mix(in srgb,var(--tinta) 42%,transparent) 0 1px,transparent 1px 12px)}
.regla-fina{height:9px;border-bottom-width:1px;border-bottom-color:var(--cuadro);
  background-size:auto 7px,auto 4px;
  background-image:repeating-linear-gradient(90deg,var(--cuadro) 0 1px,transparent 1px 36px),
    repeating-linear-gradient(90deg,color-mix(in srgb,var(--cuadro) 60%,transparent) 0 1px,transparent 1px 9px)}
/* Calibre de seis muescas: cuántas de las seis secciones tienen material. */
.calibre{display:inline-grid;grid-auto-flow:column;gap:3px;align-items:end;height:13px;flex:none}
.calibre i{display:block;width:5px;height:5px;background:var(--cuadro)}
.calibre i.on{height:13px;background:var(--boli)}
/* Barra proporcional: sustituye al guion de puntos cuando la longitud
   significa algo — en la PAU, cuántos PDF tiene esa asignatura. */
.medida{min-width:44px;height:11px;align-self:center;border-bottom:1px solid var(--cuadro);position:relative}
.medida b{position:absolute;left:0;bottom:-1px;height:8px;width:calc(var(--p,0) * 100%);
  border-bottom:2px solid var(--boli);
  background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--boli) 55%,transparent) 0 1px,transparent 1px 6px);
  background-repeat:repeat-x;background-position:left bottom;background-size:auto 5px;
  transform-origin:left center}
.guia{flex:1;min-width:20px;border-bottom:1px solid var(--cuadro);transform:translateY(-5px)}
/* Papel de cuadros: solo donde hace falta recordar de qué material está
   hecha la página; nunca como tapiz de fondo. */
.cuadricula{background-image:
    linear-gradient(color-mix(in srgb,var(--cuadro) 62%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--cuadro) 62%,transparent) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
@keyframes surge{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes telon{from{opacity:0}to{opacity:1}}
@keyframes cajon{from{transform:translateX(48px);opacity:.3}to{transform:none;opacity:1}}
/* La vista entra por el lado del que vienes: da sentido de sitio a las pestañas. */
@keyframes pane-der{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pane-izq{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
/* Cortinilla del titular y trazado de la regla. */
@keyframes cortina{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateY(10px)}
                   to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes trazo{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fila{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* La barra se dibuja midiendo, de izquierda a derecha. */
@keyframes medir{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.medida b{animation:medir .5s cubic-bezier(.2,.7,.3,1) both}
.rev{opacity:0}
.rev-on{animation:surge .55s cubic-bezier(.2,.7,.3,1) both}
.pane{animation:surge .45s cubic-bezier(.2,.7,.3,1) both}
.pane-der{animation:pane-der .42s cubic-bezier(.2,.7,.3,1) both}
.pane-izq{animation:pane-izq .42s cubic-bezier(.2,.7,.3,1) both}
.telon{animation:telon .25s ease both}
.cajon{animation:cajon .34s cubic-bezier(.2,.7,.3,1) both}
/* Portada: kicker, titular, regla y entradilla entran en cascada. */
.hero-k{animation:surge .5s cubic-bezier(.2,.7,.3,1) both}
.hero-h{animation:cortina .72s cubic-bezier(.2,.7,.3,1) .08s both}
.hero-r{transform-origin:left center;animation:trazo .55s cubic-bezier(.2,.7,.3,1) .3s both}
.hero-p{animation:surge .5s cubic-bezier(.2,.7,.3,1) .42s both}
/* Entrada escalonada de listas largas, con tope para no encadenar 40 retardos. */
.entra > *{animation:fila .34s cubic-bezier(.2,.7,.3,1) both}
.entra > :nth-child(1){animation-delay:0ms}   .entra > :nth-child(2){animation-delay:22ms}
.entra > :nth-child(3){animation-delay:44ms}  .entra > :nth-child(4){animation-delay:66ms}
.entra > :nth-child(5){animation-delay:88ms}  .entra > :nth-child(6){animation-delay:110ms}
.entra > :nth-child(7){animation-delay:132ms} .entra > :nth-child(8){animation-delay:154ms}
.entra > :nth-child(9){animation-delay:176ms} .entra > :nth-child(n+10){animation-delay:198ms}
/* Marca de la pestaña activa: un trazo de rotulador que se desliza. */
#subrayado{position:absolute;left:0;bottom:8px;height:13px;background:var(--marca-bg);width:0;
  mix-blend-mode:var(--marca);opacity:0;pointer-events:none;z-index:0;
  border-radius:1px 7px 2px 6px;
  transition:transform .34s cubic-bezier(.2,.7,.3,1),width .34s cubic-bezier(.2,.7,.3,1),opacity .2s ease}
#pestanas button{position:relative;z-index:1}
#tema-icono{display:inline-block;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
#tema:hover #tema-icono{transform:rotate(-25deg) scale(1.12)}
button{transition:background .18s ease,color .18s ease,border-color .18s ease,box-shadow .2s ease}
/* Estados hover: el subrayador pasa por encima de la fila que señalas. */
.h-acc:hover{border-color:var(--boli);color:var(--boli)}
.h-card,.h-sec{transition:border-color .2s ease,box-shadow .25s ease,transform .25s cubic-bezier(.2,.7,.3,1)}
.h-card:hover{border-color:var(--boli);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.h-sec:hover{border-color:var(--boli);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.h-fila:hover{background:color-mix(in srgb,var(--rotu) var(--rotu-fila),transparent);padding-left:14px;text-decoration:none}
.desplazado{box-shadow:0 1px 0 var(--cuadro),var(--shadow-md)}
/* Relato visual: el texto recorre la página mientras las ilustraciones
   permanecen ancladas y cambian de escala con el scroll. */
.story{margin-top:clamp(64px,9vw,112px);border-top:1.5px solid var(--tinta);border-bottom:1.5px solid var(--tinta)}
.story-grid{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(360px,1.15fr);position:relative}
.story-copy{grid-column:1;min-width:0}
.story-step{min-height:72vh;padding:clamp(32px,5vw,64px) clamp(24px,4vw,48px) clamp(32px,5vw,64px) 0;display:flex;flex-direction:column;justify-content:center;opacity:.24;transition:opacity .28s ease}
.story-step+.story-step{border-top:1px solid var(--cuadro)}
.story-step.story-activo{opacity:1}
.story-step h3{font-family:"Newsreader",Georgia,serif;font-size:clamp(30px,4.6vw,56px);font-weight:600;letter-spacing:-.02em;line-height:1.02;margin:10px 0 16px}
.story-step p{max-width:38ch;margin:0;color:var(--grafito);font-size:clamp(16px,1.8vw,18px);line-height:1.6;text-wrap:pretty}
.story-link{align-self:flex-start;margin-top:26px;min-height:44px;border:1px solid var(--tinta);background:transparent;color:var(--tinta);
  font:500 11px/1 "Martian Mono",ui-monospace,monospace;letter-spacing:-.02em;padding:14px 15px;cursor:pointer;text-align:left}
.story-link:hover{border-color:var(--boli);color:var(--boli);background:color-mix(in srgb,var(--rotu) var(--rotu-fila),transparent)}
.story-stage{grid-column:2;grid-row:1;position:sticky;top:var(--story-top,136px);align-self:start;height:var(--story-alto,calc(100vh - 168px));min-height:520px;overflow:clip;background:var(--sup);border-left:1.5px solid var(--tinta);
  background-image:
    linear-gradient(color-mix(in srgb,var(--cuadro) 62%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--cuadro) 62%,transparent) 1px,transparent 1px);
  background-size:24px 24px}
.story-stage::before,.story-stage::after{content:"";position:absolute;background:color-mix(in srgb,var(--tinta) 45%,transparent);pointer-events:none}
.story-stage::before{top:0;bottom:0;left:50%;width:1px}
.story-stage::after{left:0;right:0;top:50%;height:1px}
.story-img{position:absolute;z-index:2;left:50%;top:50%;width:min(92%,680px);height:auto;opacity:0;transform:translate3d(-50%,-50%,0) scale(.7);transform-origin:center;will-change:transform,opacity;pointer-events:none;user-select:none}
.story-meta{position:absolute;z-index:4;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;gap:16px;
  font:400 10px/1.4 "Martian Mono",ui-monospace,monospace;letter-spacing:-.02em;color:var(--grafito);pointer-events:none}
.story-progress{position:absolute;z-index:4;left:18px;right:18px;bottom:16px;height:7px;border-bottom:1px solid color-mix(in srgb,var(--tinta) 40%,transparent);pointer-events:none}
.story-progress span{display:block;width:0;height:100%;border-bottom:2px solid var(--boli);transform-origin:left center}
/* Asignatura desplegable: la cabecera es un botón de ancho completo y el
   cuerpo solo existe en el DOM cuando está abierto. */
.asig-abrir{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:transparent;border:0;
  color:var(--tinta);font-family:inherit;padding:18px clamp(14px,3vw,22px);cursor:pointer}
.asig-abrir:hover{background:color-mix(in srgb,var(--rotu) var(--rotu-fila),transparent)}
.chev{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--boli)}
@keyframes desplegar{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.asig-cuerpo{border-top:1px solid var(--cuadro);padding:0 clamp(14px,3vw,22px) 8px;
  animation:desplegar .3s cubic-bezier(.2,.7,.3,1) both}
/* Cada sección es una franja con su propio aire: a la izquierda qué es y
   cuánto hay, a la derecha los documentos sobre el fondo de la página. El
   contraste de superficie es lo que separa las seis listas entre sí. */
.sec{display:grid;grid-template-columns:minmax(190px,.32fr) 1fr;gap:clamp(18px,3.5vw,40px);
  align-items:start;padding:clamp(26px,3.6vw,38px) 0;border-top:1px solid var(--cuadro)}
.sec-id{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec-id h4{margin:0;font-family:"Martian Mono",ui-monospace,monospace;font-size:12px;font-weight:700;
  letter-spacing:-.03em;border-left:3px solid var(--boli);padding-left:11px;line-height:1.35}
.sec-id p{margin:0;padding-left:14px;font-size:15px;line-height:1.5;color:var(--grafito);max-width:32ch;text-wrap:pretty}
.sec-n{padding-left:14px;font-family:"Martian Mono",ui-monospace,monospace;font-size:11px;letter-spacing:-.02em;color:var(--grafito);font-variant-numeric:tabular-nums}
/* Lo que aún no existe ocupa menos aire que lo que sí: el ritmo se mantiene,
   la jerarquía también. */
.sec-hueca{padding-top:clamp(18px,2.4vw,24px);padding-bottom:clamp(18px,2.4vw,24px)}
.sec-hueca h4{border-left-color:var(--cuadro);color:var(--grafito)}
.sec-lista{border:1px solid var(--cuadro);background:var(--papel)}
.sec-hueco{border:1px dashed var(--cuadro);padding:14px 17px;color:var(--grafito);font-style:italic;font-size:16px}
.h-doc{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--cuadro);
  color:var(--tinta);text-decoration:none;font-size:16px;padding:11px 16px;
  transition:background .15s ease,padding-left .2s ease}
.sec-lista .h-doc:last-child{border-bottom:0}
.h-doc:hover{background:color-mix(in srgb,var(--rotu) var(--rotu-fila),transparent);padding-left:22px;text-decoration:none}
.doc-tag{font-family:"Martian Mono",ui-monospace,monospace;font-size:10px;color:var(--grafito);flex:none;letter-spacing:-.02em}
.doc-anio{font-family:"Martian Mono",ui-monospace,monospace;font-weight:700;font-size:13px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
/* ------------------------------------------------------------- portada -- */
.hero-h{font-family:"Martian Mono",ui-monospace,monospace;font-weight:800;
  font-size:clamp(40px,9.2vw,102px);letter-spacing:-.055em;line-height:.98;margin:16px 0 0}
.hero-e{max-width:46ch;font-size:clamp(18px,2.1vw,22px);line-height:1.5;margin:0;text-wrap:pretty}
/* La portada enseña lo que hace la casa: una curva trazada sobre cuadrícula. */
.plot{border:1px solid var(--cuadro);background:var(--sup);padding:14px 16px 12px;min-width:0;max-width:460px;width:100%;justify-self:end;
  background-image:
    linear-gradient(color-mix(in srgb,var(--cuadro) 62%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--cuadro) 62%,transparent) 1px,transparent 1px);
  background-size:24px 24px}
/* Banda de medida: los cuatro números del archivo colgando de una sola regla. */
.banda{margin-top:clamp(30px,4.5vw,44px)}
.banda-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:12px}
.dato{padding:0 16px 4px;border-left:1px solid var(--cuadro)}
.dato:first-child{padding-left:0;border-left:0}
.dato-n{font-family:"Martian Mono",ui-monospace,monospace;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.055em;font-size:clamp(28px,4.2vw,42px);line-height:1}
.dato-l{display:block;margin-top:6px;font-family:"Martian Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:-.02em;line-height:1.4;color:var(--grafito);max-width:18ch}
/* Al plegarse a dos columnas, el separador solo va entre columnas. */
@media (max-width:640px){
  .banda-datos{grid-template-columns:1fr 1fr}
  .dato{padding:14px 12px 4px}
  .dato:nth-child(odd){padding-left:0;border-left:0}
}
/* ---------------------------------------------------------- estructura -- */
.h2{font-family:"Newsreader",Georgia,serif;font-weight:600;letter-spacing:-.02em;
  font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:clamp(48px,6vw,72px) 0 0}
.h2-mono{font-family:"Martian Mono",ui-monospace,monospace;font-weight:700;letter-spacing:-.04em;
  font-size:clamp(24px,3vw,34px);line-height:1.1}
.tarjeta{border:1px solid var(--cuadro);background:var(--sup);display:flex;flex-direction:column}
.tarjeta-sec{text-align:left;color:var(--tinta);font-family:inherit;padding:20px;display:flex;flex-direction:column;gap:9px;cursor:pointer}
.tarjeta-t{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:22px;letter-spacing:-.015em;line-height:1.15}
.ficha-t{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(20px,2.4vw,25px);letter-spacing:-.015em;line-height:1.15}
/* Dentro de una materia todas las asignaturas comparten nombre: el curso es
   la clave por la que se busca, así que pesa como tal. */
.curso{font-family:"Martian Mono",ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:-.03em;color:var(--boli);line-height:1.4}
.ayuda-t{font-weight:600;margin:0 0 4px;font-size:18px}
/* --------------------------------------------------------------- PAU -- */
/* Rejilla, no flex: todas las barras arrancan en la misma vertical. Una
   medida sin origen común no se puede comparar de un vistazo. */
.pau-fila{width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) 260px 7ch;gap:12px;align-items:center;
  text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--cuadro);color:var(--tinta);font-family:inherit;font-size:16px;
  padding:10px 4px;cursor:pointer;transition:background .15s ease,padding-left .2s ease}
.pau-fila:hover{background:color-mix(in srgb,var(--rotu) var(--rotu-fila),transparent);padding-left:12px}
.pau-n{font-family:"Martian Mono",ui-monospace,monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;color:var(--grafito);flex:none;width:7ch;text-align:right}
.pau-fila:hover .pau-n{color:var(--boli)}
.pau-nom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){.pau-fila{grid-template-columns:8px minmax(0,1fr) 120px 7ch}}
@media (max-width:640px){.medida{display:none}.pau-fila{grid-template-columns:8px minmax(0,1fr) 7ch;gap:10px}.pau-nom{white-space:normal}}
@media (max-width:760px){
  .sec{grid-template-columns:1fr;gap:14px;padding:24px 0}

  var libros = [], librosPorAsig = {};

function cargarIndice(despues) {
  if (idxEstado === "listo") { if (despues) despues(); return; }

  return '<a class="h-doc" href="https://drive.google.com/file/d/' + esc(d.id) + '/view" target="_blank" rel="noopener">' +
    '<span class="doc-anio">' + d.anio + "</span>" +
    "<span>" + esc(detalle) + "</span>" + PUNTOS + '<span class="doc-tag">PDF</span></a>';
}

/* Fila de un libro. Lo que lo distingue de un examen no es el año sino que es
   un libro entero, así que la marca va delante y el año no aparece. El título
   ya nombra la asignatura («Castellano PAU · teoría»): anteponerla otra vez
   solo repetía la palabra dos veces en la misma línea. */
function filaLibro(l) {
  return '<a class="h-doc" href="' + esc(VER(l.id)) + '" target="_blank" rel="noopener">' +
    '<span class="anot anot-acc" style="flex:none">Libro</span>' +
    "<span>" + esc(l.titulo) + "</span>" +
    PUNTOS + '<span class="doc-tag">PDF</span></a>';
}

function cuentaLibros(n) { return n + (n === 1 ? " libro" : " libros"); }
function cuentaDocs(n) { return n + (n === 1 ? " documento" : " documentos"); }

/* Las seis secciones se pintan siempre, en el mismo orden y con el mismo
   aspecto. Una asignatura sin ejercicios enseña la sección vacía: así se ve
   de un vistazo qué falta y todas las asignaturas se leen igual. */
function bloqueSeccion(a, sec) {
  var lista = docsDe(a, sec[0]);
  var extra = "", pie = "", cuenta = lista.length ? cuentaDocs(lista.length) : "Pendiente";
  /* La asignatura que se prepara con un libro de la PAU lo enseña aquí, en la
     misma sección donde estaría su manual propio. */
  if (sec[0] === "libro") {
    var libros = librosDe(a.pau);
    if (libros && libros.length) {
      extra = libros.map(filaLibro).join("");
      cuenta = (lista.length ? cuentaDocs(lista.length) + " · " : "") +
        cuentaLibros(libros.length) + " de la PAU";
    }
  }
  if (sec[0] === "simulacros") {
    var pau = docsPau(a);
    if (pau && pau.length) {
      var anios = [];
      pau.forEach(function (d) { if (anios.indexOf(d.anio) === -1) anios.push(d.anio); });
      anios.sort(function (x, y) { return y - x; });
      var recientes = anios.slice(0, 3);
      extra = pau.filter(function (d) { return recientes.indexOf(d.anio) !== -1; })
        .sort(function (x, y) { return y.anio - x.anio; })
        .map(filaPauDoc).join("");
      cuenta = (lista.length ? cuentaDocs(lista.length) + " · " : "") + pau.length + " de la PAU";
      pie = '<button class="tap h-acc" ' + abridor("PAU · Comunitat Valenciana", a.pau, carpetaPau(a.pau)) +
        ' style="' + btn(false) + ';margin-top:14px">Ver las ' + pau.length + " convocatorias</button>";
    } else if (a.pau) {
      pie = '<button class="tap h-acc" data-ir="pau" style="' + btn(false) + ';margin-top:14px">Abrir el archivo de la PAU</button>';
    }
  }
  var cuerpo = lista.map(filaDocumento).join("") + extra;
  return '<section class="sec' + (cuerpo ? "" : " sec-hueca") + '">' +
    '<div class="sec-id"><h4>' + esc(sec[1]) + "</h4>" +
    "<p>" + esc(sec[2]) + "</p>" +
    '<span class="sec-n">' + esc(cuenta) + "</span></div>" +
    "<div>" +
    (cuerpo ? '<div class="sec-lista">' + cuerpo + "</div>"
            : '<p class="sec-hueco">Todavía no hay nada aquí.</p>') +
    pie + "</div></section>";
}

function cuerpoAsignatura(a) {
  /* El aviso va marcado con rotulador: es la nota al margen del cuaderno. */
  var aviso = a.aviso
    ? '<p style="margin:0 0 16px;border-left:3px solid var(--tinta);padding:10px 13px;background:color-mix(in srgb,var(--rotu) var(--rotu-fila),transparent);font-size:16px">' + esc(a.aviso) + "</p>"
    : "";
  var leyenda = tieneRestringidos(a)
    ? '<p class="anot" style="display:flex;align-items:center;gap:8px;margin:0;border-top:1px solid var(--cuadro);padding:14px 0 4px">' +
      ICONO_LLAVE + "<span>" + esc(AVISO_RESTRINGIDO) + "</span></p>"
    : "";
  return aviso + SECCIONES_DOC.map(function (s) { return bloqueSeccion(a, s); }).join("") + leyenda;
}

/* Calibre de seis muescas: de un vistazo, cuánto del curso está montado. */
function calibre(llenas, total) {
  var s = '<span class="calibre" aria-hidden="true">';
  for (var i = 0; i < total; i++) s += "<i" + (i < llenas ? ' class="on"' : "") + "></i>";
  return s + "</span>";
}

function tarjetaAsignatura(a, i) {
  var abierta = !!S.abiertas[a.id];
  var n = totalDocs(a);
  var pau = docsPau(a);
  var llenas = seccionesLlenas(a);
  var meta = a.proximamente
    ? "Próximamente"
    : n + (n === 1 ? " documento" : " documentos") + (pau ? " · " + pau.length + " de la PAU" : "") +
      " · " + llenas + "/6 secciones";
  var chevron = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex:none;color:var(--grafito)" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>';
  return '<article class="rev" id="asig-' + esc(a.id) + '" style="border:1px solid ' + (abierta ? "var(--tinta)" : "var(--cuadro)") +
    ";background:var(--sup);" + retardo(i) + '">' +
    '<h3 style="margin:0">' +
    '<button class="asig-abrir" data-asig="' + esc(a.id) + '" aria-expanded="' + (abierta ? "true" : "false") +
    '" aria-controls="cuerpo-' + esc(a.id) + '">' +
    '<span style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">' +
    '<span class="curso">' + esc(a.curso) + "</span>" +
    '<span class="ficha-t">' + esc(a.nombre) + "</span>" +
    '<span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
    (a.proximamente ? "" : calibre(llenas, 6)) +
    '<span class="anot">' + esc(meta) + "</span></span>" +
    "</span>" + chevron + "</button></h3>" +
    (abierta
      ? '<div class="asig-cuerpo" id="cuerpo-' + esc(a.id) + '" role="region" aria-label="' + esc(a.nombre + " " + a.curso) + '">' +
        '<p style="margin:18px 0 22px;font-size:17px;line-height:1.55;max-width:62ch;text-wrap:pretty">' + esc(a.nota) + "</p>" +
        cuerpoAsignatura(a) + "</div>"
      : "") +
    "</article>";
}

/* En la PAU la longitud significa algo, así que el guion se convierte en barra:
   cada asignatura se mide contra la que más exámenes acumula. */
var PAU_MAX = PAU.reduce(function (m, p) { return Math.max(m, p[1]); }, 1);

function filaPau(p, conEtiqueta) {
  var marca = conEtiqueta
    ? '<span class="anot anot-acc" style="flex:none">PAU</span>'
    : '<span style="display:inline-block;width:6px;height:6px;flex:none;background:' + (p[3] ? "var(--boli)" : "transparent") + '"></span>';
  return '<button class="pau-fila" ' + abridor("PAU · Comunitat Valenciana", p[0], p[2]) + ">" +
    marca + '<span class="pau-nom"' + (p[3] ? ' style="font-weight:600"' : "") + ">" + esc(p[0]) + "</span>" +
    '<span class="medida" style="--p:' + (p[1] / PAU_MAX).toFixed(3) + '" aria-hidden="true"><b></b></span>' +
    '<span class="pau-n">' + p[1] + " PDF</span></button>";
}

function vistaInicio() {
  /* Los cuatro números del archivo cuelgan de una sola regla graduada: es la

  var stats = ESTADISTICAS.map(function (s, i) {
    var cifra = s.texto !== undefined
      ? esc(s.texto)
      : '<span data-stat="' + s.valor + '">0</span>';
    return '<div class="dato rev" style="' + retardo(i) + '">' +
      '<div class="dato-n">' + cifra + "</div>" +
      '<span class="dato-l">' + esc(s.label) + "</span></div>";
  }).join("");

    return '<button class="rev h-sec tarjeta tarjeta-sec" data-ir="' + s.destino + '" style="' + retardo(i) + '">' +
      '<span class="anot anot-acc">' + n + (n === 1 ? " asignatura" : " asignaturas") + "</span>" +
      '<span class="tarjeta-t">' + esc(s.titulo) + "</span>" +

    ["Busca por nombre, año o convocatoria", "Escribe «física 2023» o «latín extraordinaria» y ve directo al PDF, sin bucear por carpetas."],
    ["Practica con la PAU", "Convocatorias 2010–2026 de las 40 asignaturas, cada una con el examen y los criterios de corrección."]
  ].map(function (a) {
    return '<div class="rev"><p class="ayuda-t">' + esc(a[0]) + "</p>" +
      '<p style="color:var(--grafito);margin:0;line-height:1.55;font-size:16px">' + esc(a[1]) + "</p></div>";
  }).join("");

  return "<section>" +
    '<p class="hero-k anot">Física y Química · Matemáticas · Biología</p>' +
    '<h1 class="hero-h">Apuntes</h1>' +
    '<div class="hero-r regla" style="margin:22px 0 0" aria-hidden="true"></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,4vw,44px);align-items:start;margin-top:26px">' +
    '<p class="hero-p hero-e">Materiales de clase y bancos de exámenes, de 2º de ESO a 2º de Bachillerato, y el archivo completo de la PAU valenciana.</p>' +
    '<div class="hero-p plot cuadricula" id="hero-anim"></div></div>' +
    '<div class="banda"><div class="regla" aria-hidden="true"></div>' +
    '<div class="banda-datos">' + stats + "</div></div>" +
    '<section id="historia-visual" class="story" aria-labelledby="historia-titulo">' +
    '<div style="padding:clamp(28px,5vw,52px) 0">' +
    '<p class="anot anot-acc" style="margin:0 0 10px">Explora las materias</p>' +
    '<h2 id="historia-titulo" class="t-serif" style="font-size:clamp(32px,5.6vw,64px);margin:0;max-width:13ch">Aprender también es mirar.</h2></div>' +
    '<div class="story-grid"><div class="story-copy">' +
    '<article class="story-step story-activo" data-story-step="0"><div>' +
    '<span class="anot anot-acc">Materia</span>' +
    '<h3>La materia se mueve.</h3><p>Trayectorias, ondas, átomos y enlaces: la Física y la Química convierten lo invisible en algo que puedes observar, medir y explicar.</p>' +
    '<button class="story-link" data-ir="fyq">Entrar en Física y Química</button></div></article>' +
    '<article class="story-step" data-story-step="1"><div>' +
    '<span class="anot anot-acc">Número</span>' +
    '<h3>Las formas piensan.</h3><p>Funciones, superficies y estructuras geométricas revelan patrones. Las Matemáticas ordenan lo complejo sin quitarle profundidad.</p>' +
    '<button class="story-link" data-ir="mat">Entrar en Matemáticas</button></div></article>' +
    '<article class="story-step" data-story-step="2"><div>' +
    '<span class="anot anot-acc">Vida</span>' +
    '<h3>La vida deja huella.</h3><p>De la célula al ADN, cada escala contiene otra historia. La Biología conecta formas, procesos y evolución en un mismo sistema.</p>' +
    '<button class="story-link" data-ir="bio">Entrar en Biología</button></div></article></div>' +
    '<div class="story-stage" aria-hidden="true">' +
    '<div class="story-meta"><span>Colección visual</span><span data-story-count>01 / 03</span></div>' +

    '<img class="story-img" data-story-img="2" src="assets/visuales/biologia.webp" width="1000" height="1000" alt="" loading="lazy" decoding="async">' +
    '<div class="story-progress"><span data-story-progress></span></div></div></div></section>' +
    '<h2 class="h2">Dónde está cada cosa</h2>' +
    '<div class="regla regla-fina" style="margin:14px 0 0" aria-hidden="true"></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:22px">' + secciones + "</div>" +
    '<h2 class="h2">Cómo usar esta web</h2>' +
    '<div class="regla regla-fina" style="margin:14px 0 0" aria-hidden="true"></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;margin-top:22px">' + ayuda + "</div>" +
    '<div style="border:1px solid var(--cuadro);padding:18px 20px;margin-top:44px">' +
    '<p class="anot anot-acc" style="margin:0 0 6px">Calendarios</p>' +
    '<p style="margin:0;color:var(--grafito);font-size:16px">Las fechas de exámenes y entregas se activarán al inicio del curso 2026-27. El resto de secciones ya están operativas.</p></div>' +
    "</section>";
}

function asignaturasDe(clave) {
  return ASIGNATURAS.filter(function (a) {
    if (a.materia !== clave) return false;
    return S.nivel === "todos" || a.nivel === S.nivel;
  });
}

function listaAsignaturas(clave) {
  var lista = asignaturasDe(clave);
  if (!lista.length) {
    return '<p style="font-style:italic;color:var(--sut);padding:24px 0">No hay asignaturas de ese nivel en esta materia.</p>';
  }
  return lista.map(function (a, i) { return tarjetaAsignatura(a, i); }).join("");
}

function vistaMateria(clave) {
  var m = MATERIAS[clave];
  var filtros = FILTROS.map(function (f) {
    return '<button class="tap" data-nivel="' + f[0] + '" style="' + btn(S.nivel === f[0]) + '">' + esc(f[1]) + "</button>";
  }).join("");
  var conMaterial = ASIGNATURAS.filter(function (a) { return a.materia === clave && !a.proximamente; }).length;
  var total = ASIGNATURAS.filter(function (a) { return a.materia === clave; }).length;
  return "<section>" +
    '<p class="anot" style="margin:0">' + esc(m.kicker) + "</p>" +
    '<h2 class="t-serif" style="font-size:clamp(32px,6vw,60px);margin:10px 0 0">' + esc(m.titulo) + "</h2>" +
    REGLA +
    '<p style="max-width:60ch;margin:22px 0 0;text-wrap:pretty">Elige una asignatura y se despliega su curso completo, siempre con las mismas seis secciones: currículo, criterios, presentaciones, libro, ejercicios por temas y simulacros de examen.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px">' + filtros + "</div>" +
    '<p class="anot" style="margin:16px 0 0">' +
    conMaterial + " de " + total + " asignaturas con material</p>" +
    '<div id="cursos-grid" style="display:grid;gap:12px;margin-top:16px">' + listaAsignaturas(clave) + "</div>" +
    "</section>";
}

function listaPau() {
  var q = norm(S.qPau.trim());
  var lista = PAU.filter(function (p) { return norm(p[0]).indexOf(q) !== -1; });
  if (S.orden === "az") lista = lista.slice().sort(function (a, b) { return a[0].localeCompare(b[0], "es"); });
  return lista;
}

/* El estante de libros va antes del archivo y no lo filtra el buscador de
   asignaturas: son nueve, se leen de un vistazo y son material propio, no
   parte del archivo oficial de la GVA. */
function bloqueLibros() {
  var libros = (IDX && IDX.libros) || [];
  if (!libros.length) return "";
  var asigs = [];
  libros.forEach(function (l) { if (asigs.indexOf(l.asig) === -1) asigs.push(l.asig); });
  return '<section class="sec">' +
    '<div class="sec-id"><h4>Libros de preparación</h4>' +
    "<p>Manuales propios para preparar la prueba, siempre en la edición del alumno: teoría, práctica y exámenes trabajados.</p>" +
    '<span class="sec-n">' + esc(cuentaLibros(libros.length)) + " · " +
    asigs.length + " asignaturas</span></div>" +
    '<div><div class="sec-lista">' +
    libros.map(filaLibro).join("") +
    "</div></div></section>";
}

function cuerpoPau(lista, animar) {
  var filas = '<div class="' + (animar ? "entra" : "") + '" style="margin-top:8px">' +
    lista.map(function (p) { return filaPau(p, false); }).join("") + "</div>";
  var vacio = lista.length === 0
    ? '<p style="font-style:italic;color:var(--sut);padding:20px 4px">Ninguna asignatura coincide con el filtro.</p>'
    : "";
  return filas + vacio;
}

function vistaPau() {
  var lista = listaPau();
  var ordenes = ORDENES.map(function (o) {
    return '<button class="tap" data-orden="' + o[0] + '" style="' + ordenEstilo(S.orden === o[0]) + '">' + esc(o[1]) + "</button>";
  }).join("");
  return "<section>" +
    '<p class="anot" style="margin:0">Comunitat Valenciana · 2010–2026</p>' +
    '<h2 class="t-serif" style="font-size:clamp(30px,5.4vw,56px);margin:10px 0 0">Selectivos — PAU</h2>' +
    REGLA +
    '<p style="max-width:62ch;margin:22px 0 0;text-wrap:pretty">Archivo completo de la PAU valenciana: las 40 asignaturas, convocatorias 2010–2026 (ordinaria, extraordinaria y modelos), cada una con examen y criterios de corrección. Fuente: <a href="https://universitats.gva.es/es/proves-acces-universitat" target="_blank" rel="noopener">universitats.gva.es</a>.</p>' +
    '<div id="pau-libros">' + bloqueLibros() + "</div>" +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px">' +
    '<div style="' + CAJA_BUSCA + '">' + LUPA +
    '<input id="pau-q" type="search" value="' + esc(S.qPau) + '" placeholder="Filtrar asignatura — p. ej. física, latín, dibujo…" aria-label="Filtrar asignatura PAU" autocomplete="off" style="flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--tinta);font-family:inherit;font-size:16px;padding:10px 0"></div>' +
    '<div style="display:flex;gap:0;border:1px solid var(--cuadro)">' + ordenes + "</div></div>" +
    '<p id="pau-resumen" class="anot" style="margin:18px 0 0">' + lista.length + " de 40 asignaturas · examen + criterios + modelo</p>" +
    '<p class="anot" style="margin:5px 0 0">La barra mide los PDF de cada asignatura frente a la que más acumula (' + PAU_MAX + ").</p>" +
    '<div id="pau-cuerpo">' + cuerpoPau(lista, true) + "</div></section>";
}

function vistaBusqueda(gq) {
  var tsg = terminos(S.q);
  var resCursos = ASIGNATURAS.filter(function (a) {
    return casa(norm(MATERIAS[a.materia].titulo + " " + a.nombre + " " + a.curso + " " + a.nota), tsg);
  });
  var resMaterial = DOC_INDICE.filter(function (r) { return casa(r.busca, tsg); });
  var resPau = PAU.filter(function (p) { return norm(p[0]).indexOf(gq) !== -1; });
  var resLibros = ((IDX && IDX.libros) || []).filter(function (l) { return casa(l.busca, tsg); });
  /* Los exámenes solo entran cuando la consulta no es ya el nombre pelado de
     una asignatura: si buscas "física" quieres la asignatura, no sus 75 PDF. */
  var resDocs = [];
  var TOPE = 60;
  if (IDX && !(resPau.length && norm(resPau[0][0]) === gq)) {
    var ts = terminos(S.q);
    resDocs = IDX.todos.filter(function (d) { return casa(d.busca, ts); });
  }
  var total = resCursos.length + resMaterial.length + resLibros.length +
    resPau.length + resDocs.length;

  var tarjetas = resCursos.map(function (a) {
    var n = totalDocs(a);
    return '<button class="h-card" data-abrir="' + esc(a.id) + '" style="' + TARJETA +
      ';padding:18px;gap:8px;text-align:left;color:var(--tinta);font-family:inherit;cursor:pointer">' +
      '<span class="anot anot-acc">' +
      esc(MATERIAS[a.materia].titulo + " · " + a.curso) + "</span>" +
      '<span class="ficha-t">' + esc(a.nombre) + "</span>" +
      '<span class="anot">' +
      (a.proximamente ? "Próximamente" : n + " documentos") + "</span>" +
      '<span style="font-size:16px;color:var(--grafito);line-height:1.5">' + esc(a.nota) + "</span></button>";
  }).join("");

  var TOPE_MAT = 40;
  var bloqueMaterial = "";
  if (resMaterial.length) {
    bloqueMaterial = '<h3 class="anot" style="margin:34px 0 0">' +
      "Material de clase · " + resMaterial.length +
      (resMaterial.length > TOPE_MAT ? " (se muestran los " + TOPE_MAT + " primeros)" : "") + "</h3>" +
      '<div style="margin-top:10px">' + resMaterial.slice(0, TOPE_MAT).map(function (r) {
        var cerrado = esRestringido(r.d);
        return '<a class="h-fila" href="' + esc(VER(r.d[1])) + '" target="_blank" rel="noopener" style="' +
          FILA + ";text-decoration:none" + (cerrado ? ";color:var(--grafito)" : "") + '">' +
          (cerrado ? ICONO_LLAVE : "") +
          '<span class="anot anot-acc" style="flex:none">' +
          esc(r.a.curso) + "</span><span>" + esc(r.a.nombre + " · " + r.sec + " · " + r.d[0]) + "</span>" + PUNTOS +
          '<span class="doc-tag">' + esc(r.d[2] || "PDF") + "</span></a>";
      }).join("") + "</div>";
  }

  var bloqueLibro = "";
  if (resLibros.length) {
    bloqueLibro = '<h3 class="anot" style="margin:34px 0 0">Libros de preparación · ' +
      resLibros.length + "</h3>" +
      '<div class="sec-lista" style="margin-top:10px">' +
      resLibros.map(filaLibro).join("") + "</div>";
  }

  var filas = resPau.map(function (p) { return filaPau(p, true); }).join("");

  var bloqueDocs = "";
  if (resDocs.length) {
    var recorte = resDocs.slice(0, TOPE);
    bloqueDocs = '<h3 class="anot" style="margin:34px 0 0">' +
      "Exámenes · " + resDocs.length +
      (resDocs.length > TOPE ? " (se muestran los " + TOPE + " primeros)" : "") + "</h3>" +
      '<div style="margin-top:10px">' + recorte.map(function (d) {
        return '<a class="h-fila" href="https://drive.google.com/file/d/' + esc(d.id) + '/view" target="_blank" rel="noopener" style="' +
          FILA + ';text-decoration:none">' +
          '<span class="anot anot-acc" style="flex:none">PAU</span>' +
          '<span class="doc-anio">' + d.anio + "</span>" +
          "<span>" + esc(d.asig + " · " + (d.conv === d.tipo ? d.tipo : d.conv + " · " + d.tipo) + (d.matiz ? " · " + d.matiz : "")) + "</span>" +
          PUNTOS + '<span class="doc-tag">PDF</span></a>';
      }).join("") + "</div>";
  }

  var vacio = total === 0
    ? '<p style="font-style:italic;color:var(--sut);padding:24px 0">Nada coincide con la búsqueda.</p>'
    : "";
  var resumen = total + (total === 1 ? " coincidencia" : " coincidencias") + " para «" + S.q.trim() + "»";

  return "<section>" +
    '<p class="anot" style="margin:0 0 8px">Resultados</p>' +
    '<h2 class="t-serif" style="font-size:clamp(26px,4.4vw,42px);margin:0">' + esc(resumen) + "</h2>" +
    REGLA +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px">' + tarjetas + "</div>" +
    bloqueMaterial + bloqueLibro +
    '<div style="margin-top:28px">' + filas + "</div>" + bloqueDocs + vacio + "</section>";
}

var vista = document.getElementById("vista");
var pestanas = document.getElementById("pestanas");
var buscador = document.getElementById("buscador");
var cabecera = document.getElementById("cabecera");
var host = document.getElementById("panel-host");
var botonTema = document.getElementById("tema");

var ultimaClave = null;
var obs = null;
var raf = 0;
var ultimoFoco = null;
var historiaViva = null;

/* Enrutado por hash: la URL refleja la pestaña abierta. Se aceptan las anclas
   de la web anterior para que los enlaces compartidos sigan funcionando. */
var ALIAS = {
  "": "inicio", inicio: "inicio", portada: "inicio", asignaturas: "inicio",
  fyq: "fyq", "fisica-y-quimica": "fyq", "fisica": "fyq", "quimica": "fyq",
  mat: "mat", matematicas: "mat",
  bio: "bio", biologia: "bio",
  pau: "pau", selectivos: "pau", selectividad: "pau", "pau-lista": "pau", "filtro-pau": "pau"
};

/* El hash lleva pestaña y, si hay una asignatura desplegada, su identificador:
   #fyq/fyq-4eso. Así se puede compartir el enlace de una asignatura concreta. */
function rutaDeHash() {
  var h = "";
  try { h = decodeURIComponent(location.hash.replace(/^#/, "")); } catch (e) { h = location.hash.replace(/^#/, ""); }
  var partes = h.split("/");
  var tab = ALIAS[norm(partes[0])] || null;
  var asig = partes[1] ? norm(partes[1]) : null;
  if (asig && !ASIGNATURAS.some(function (a) { return a.id === asig; })) asig = null;
  return { tab: tab, asig: asig };
}

function hashDe(tab, asig) {
  if (tab === "inicio") return "";
  return "#" + tab + (asig ? "/" + asig : "");
}

function escribirHash(tab, asig) {
  var h = hashDe(tab, asig);
  if ((location.hash || "") === h) return;
  try { history.pushState(null, "", location.pathname + location.search + h); } catch (e) {}
}

function desdeHistorial() {
  var r = rutaDeHash();
  var t = r.tab || "inicio";
  if (r.asig) S.abiertas[r.asig] = 1;
  if (t === S.tab && !S.q) { if (r.asig) renderCursos(); return; }
  S.tab = t;
  S.q = "";
  buscador.value = "";
  actualizarPestanas();
  render({ animarStats: t === "inicio" });
}

function claveVista() {
  if (norm(S.q.trim())) return "busqueda";
  if (MATERIAS[S.tab]) return "materia:" + S.tab;
  if (S.tab === "pau") return "pau";
  return "inicio";
}

function html() {
  var gq = norm(S.q.trim());
  if (gq) return vistaBusqueda(gq);
  if (MATERIAS[S.tab]) return vistaMateria(S.tab);
  if (S.tab === "pau") return vistaPau();
  return vistaInicio();
}

/* Dirección de la transición: si vas a una pestaña que está más a la derecha,
   la vista entra desde la derecha. Con la búsqueda de por medio no hay
   dirección que valga, así que se usa la entrada neutra de siempre. */
var CLASES_PANE = ["pane", "pane-der", "pane-izq"];

function tabDeClave(clave) {
  if (!clave || clave === "busqueda") return null;
  return clave.indexOf("materia:") === 0 ? clave.slice(8) : clave;
}

function clasePane(anterior, actual) {
  var a = tabDeClave(anterior), b = tabDeClave(actual);
  if (!a || !b) return "pane";
  var ia = ORDEN_TABS.indexOf(a), ib = ORDEN_TABS.indexOf(b);
  if (ia < 0 || ib < 0 || ia === ib) return "pane";
  return ib > ia ? "pane-der" : "pane-izq";
}

function render(opts) {
  opts = opts || {};
  var clave = claveVista();
  var nueva = clave !== ultimaClave;
  var clase = clasePane(ultimaClave, clave);
  ultimaClave = clave;
  vista.innerHTML = html();
  CLASES_PANE.forEach(function (c) { vista.classList.remove(c); });
  if (nueva) { void vista.offsetWidth; vista.classList.add(clase); }
  if (clave === "inicio") {
    pintarStats(opts.animarStats === true);
    montarHero();
    montarHistoria();
  } else {
    desmontarHero();
    desmontarHistoria();
  }
  reobservar();
}

/* El trazador de la portada vive en hero.js. Si el archivo no cargara, esto
   se queda en nada y la página sigue igual. */
var heroVivo = null;
function montarHero() {
  desmontarHero();
  var caja = document.getElementById("hero-anim");
  if (caja && window.heroApuntes) heroVivo = window.heroApuntes.montar(caja);
}
function desmontarHero() {
  if (heroVivo) { heroVivo.destruir(); heroVivo = null; }
}

/* La posición se deriva siempre del scroll: al subir, la coreografía se
   reproduce exactamente al revés. rAF agrupa los eventos sin crear inercia. */
function montarHistoria() {
  desmontarHistoria();
  var raiz = document.getElementById("historia-visual");
  if (!raiz) return;
  if (menosMovimiento()) {
    historiaViva = { destruir: function () {} };
    return;
  }
  var imagenes = [].slice.call(raiz.querySelectorAll("[data-story-img]"));
  var pasos = [].slice.call(raiz.querySelectorAll("[data-story-step]"));
  var contador = raiz.querySelector("[data-story-count]");
  var barra = raiz.querySelector("[data-story-progress]");
  var frame = 0, activo = -1;
  function limite(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function ajustarMarco() {
    var altoCabecera = cabecera ? cabecera.getBoundingClientRect().height : 0;
    var top = Math.ceil(altoCabecera + 12);
    var movil = window.innerWidth <= 760;
    var alto = movil
      ? Math.max(330, Math.min(window.innerHeight * .52, window.innerHeight - top - 24))
      : Math.max(520, window.innerHeight - top - 32);
    raiz.style.setProperty("--story-top", top + "px");
    raiz.style.setProperty("--story-alto", alto + "px");
  }
  /* La posición se saca de dónde está cada paso, no de una fracción de la
     sección: así la ilustración y el texto que estás leyendo van siempre a la
     par. Cuando el centro de un paso cruza el centro de la pantalla, su imagen
     está entera y ese paso queda activo. */
  function posicion() {
    var centro = window.innerHeight * .5;
    var centros = pasos.map(function (p) {
      var b = p.getBoundingClientRect();
      return b.top + b.height / 2;
    });
    if (centro <= centros[0]) return 0;
    if (centro >= centros[centros.length - 1]) return centros.length - 1;
    for (var k = 0; k < centros.length - 1; k++) {
      if (centro <= centros[k + 1]) {
        var tramo = centros[k + 1] - centros[k];
        return k + (tramo ? (centro - centros[k]) / tramo : 0);
      }
    }
    return centros.length - 1;
  }

  function pintar() {
    frame = 0;
    if (!document.contains(raiz)) return;
    var punto = posicion();
    var avance = pasos.length > 1 ? punto / (pasos.length - 1) : 0;
    imagenes.forEach(function (img, k) {
      var rel = punto - k;
      var fuera = limite(Math.abs(rel), 0, 1);
      /* La imagen activa se ve a tamaño natural; las vecinas se acercan o se
         alejan sin llegar a recortarse. */
      var escala = 1 - fuera * .16 + (rel > 0 ? fuera * .3 : 0);
      var y = -rel * 54;
      img.style.opacity = String(limite(1 - Math.abs(rel) * 1.15, 0, 1));
      img.style.transform = "translate3d(-50%,-50%,0) translateY(" + y.toFixed(1) + "px) scale(" + escala.toFixed(3) + ") rotate(" + (rel * 1.1).toFixed(2) + "deg)";
    });
    var nuevo = limite(Math.round(punto), 0, pasos.length - 1);
    if (nuevo !== activo) {
      activo = nuevo;
      pasos.forEach(function (paso, k) {
        paso.classList.toggle("story-activo", k === activo);
        if (k === activo) paso.setAttribute("aria-current", "true");
        else paso.removeAttribute("aria-current");
      });
      if (contador) contador.textContent = "0" + (activo + 1) + " / 03";
    }
    if (barra) barra.style.width = (avance * 100).toFixed(2) + "%";
  }
  function solicitar() { if (!frame) frame = requestAnimationFrame(pintar); }
  function alRedimensionar() { ajustarMarco(); solicitar(); }
  window.addEventListener("scroll", solicitar, { passive: true });
  window.addEventListener("resize", alRedimensionar, { passive: true });
  ajustarMarco();
  pintar();
  historiaViva = {
    destruir: function () {
      if (frame) cancelAnimationFrame(frame);
      window.removeEventListener("scroll", solicitar);
      window.removeEventListener("resize", alRedimensionar);
    }
  };
}

function desmontarHistoria() {
  if (historiaViva) { historiaViva.destruir(); historiaViva = null; }
}

function pintarPestanas() {
  pestanas.innerHTML = PESTANAS.map(function (t) {
    return '<button data-ir="' + t[0] + '" style="' + tabEstilo(S.tab === t[0] && !S.q) + '">' + esc(t[1]) + "</button>";
  }).join("") + '<span id="subrayado"></span>';
  moverSubrayado(true);
}

/* Coloca la regla roja bajo la pestaña activa. En el primer pintado salta sin
   transición; después se desliza. */
function moverSubrayado(instantaneo) {
  var sub = document.getElementById("subrayado");
  if (!sub) return;
  var act = S.q ? null : pestanas.querySelector('[data-ir="' + S.tab + '"]');
  if (instantaneo) sub.style.transition = "none";
  if (!act) {
    sub.style.opacity = "0";
  } else {
    sub.style.opacity = "1";
    sub.style.width = act.offsetWidth + "px";
    sub.style.transform = "translateX(" + act.offsetLeft + "px)";
  }
  if (instantaneo) requestAnimationFrame(function () { sub.style.transition = ""; });
}
function actualizarPestanas() {
  var b = pestanas.querySelectorAll("[data-ir]");
  for (var i = 0; i < b.length; i++) b[i].setAttribute("style", tabEstilo(S.tab === b[i].dataset.ir && !S.q));
  moverSubrayado();
}

function pintarStats(animar) {
  cancelAnimationFrame(raf);
  var nodos = [].slice.call(document.querySelectorAll("[data-stat]"));
  if (!nodos.length) return;
  var finales = nodos.map(function (n) { return +n.dataset.stat; });
  if (!animar || menosMovimiento()) {
    nodos.forEach(function (n, i) { n.textContent = String(finales[i]); });
    return;
  }
  var t0 = performance.now(), dur = 950;
  var paso = function (ahora) {
    var t = Math.min(1, (ahora - t0) / dur);
    var f = 1 - Math.pow(1 - t, 3);
    nodos.forEach(function (n, i) { n.textContent = String(Math.round(finales[i] * f)); });
    if (t < 1) raf = requestAnimationFrame(paso);
  };
  raf = requestAnimationFrame(paso);
}

function reobservar() {
  if (!obs) {
    [].forEach.call(document.querySelectorAll(".rev"), function (n) { n.classList.add("rev-on"); });
    return;
  }
  requestAnimationFrame(function () {
    [].forEach.call(document.querySelectorAll(".rev:not(.rev-on)"), function (n) { obs.observe(n); });
  });
}

function ir(tab) {
  S.tab = tab;
  S.q = "";
  buscador.value = "";
  escribirHash(tab, null);
  actualizarPestanas();
  render({ animarStats: tab === "inicio" });
  window.scrollTo({ top: 0, behavior: menosMovimiento() ? "auto" : "smooth" });
}

/* Desde la búsqueda: salta a la materia de la asignatura, la despliega y la
   deja a la vista. El filtro de nivel se levanta para que no la esconda. */
function irAAsignatura(id) {
  var a = null;
  for (var i = 0; i < ASIGNATURAS.length; i++) if (ASIGNATURAS[i].id === id) a = ASIGNATURAS[i];
  if (!a) return;
  S.tab = a.materia;
  S.nivel = "todos";
  S.abiertas[id] = 1;
  S.q = "";
  buscador.value = "";
  escribirHash(a.materia, id);
  actualizarPestanas();
  render();
  var caja = document.getElementById("asig-" + id);
  if (caja) caja.scrollIntoView({ behavior: menosMovimiento() ? "auto" : "smooth", block: "start" });
}

function renderCursos() {
  if (!MATERIAS[S.tab]) return;
  var grid = document.getElementById("cursos-grid");
  if (grid) grid.innerHTML = listaAsignaturas(S.tab);
  [].forEach.call(vista.querySelectorAll("[data-nivel]"), function (b) {
    b.setAttribute("style", btn(S.nivel === b.dataset.nivel));
  });
  reobservar();
}

/* Al plegar o desplegar solo se repinta la lista de asignaturas: la cabecera
   de la materia y la posición de scroll se quedan donde estaban. */
function alternarAsignatura(id) {
  var a = null;
  for (var i = 0; i < ASIGNATURAS.length; i++) if (ASIGNATURAS[i].id === id) a = ASIGNATURAS[i];
  if (!a) return;
  if (S.abiertas[id]) delete S.abiertas[id];
  else S.abiertas[id] = 1;
  escribirHash(S.tab, S.abiertas[id] ? id : null);
  renderCursos();
  var boton = document.querySelector('[data-asig="' + id + '"]');
  if (boton) boton.focus({ preventScroll: true });
}

function renderPau() {
  var lista = listaPau();
  var resumen = document.getElementById("pau-resumen");
  var cuerpo = document.getElementById("pau-cuerpo");
  if (resumen) resumen.textContent = lista.length + " de 40 asignaturas · examen + criterios + modelo";
  if (cuerpo) cuerpo.innerHTML = cuerpoPau(lista);
  [].forEach.call(vista.querySelectorAll("[data-orden]"), function (b) {
    b.setAttribute("style", ordenEstilo(S.orden === b.dataset.orden));
  });
}

/* ----------------------------------------------------------------- panel -- */

function htmlPanel(p) {
  return '<div class="telon" data-telon style="position:fixed;inset:0;z-index:60;background:color-mix(in srgb,#191c1a 58%,transparent);display:flex;justify-content:flex-end">' +

    '<div style="display:flex;align-items:center;gap:12px;padding:14px clamp(14px,3vw,22px);border-bottom:1.5px solid var(--tinta)">' +
    '<div style="margin-right:auto;min-width:0">' +
    '<div class="anot anot-acc" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.kicker) + "</div>" +
    '<div class="ficha-t" style="margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.titulo) + "</div></div>" +

    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"></path></svg><span>Drive</span></a>' +
    '<button class="h-acc" data-cerrar aria-label="Cerrar" style="border:1px solid var(--cuadro);background:transparent;color:var(--tinta);width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none">' +

/* Con el índice cargado, el panel lista los exámenes de la asignatura y deja
   filtrarlos. Sin él, cae al visor de carpeta de Drive de siempre. */
function cuerpoPanel(p) {
  if (p.modo !== "docs") {
    return '<div style="flex:1;position:relative;background:var(--sup)">' +
      '<div class="anot" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">Cargando carpeta…</div>' +
      '<iframe src="' + esc(EMB(p.id)) + '" title="Carpeta de Google Drive" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;transition:opacity .4s ease;opacity:0"></iframe></div>';
  }
  var chips = ["Todos"].concat(IDX.tipos).map(function (t) {
    return '<button class="tap" data-tipo="' + esc(t) + '" style="' + btn(p.tipo === t) + '">' + esc(t) + "</button>";
  }).join("");
  /* El libro va arriba del todo y fuera del filtro: quien abre la asignatura
     para estudiarla lo quiere ver antes que la lista de convocatorias. */
  var libros = librosDe(p.titulo);
  var estante = libros
    ? '<div style="padding:14px clamp(14px,3vw,22px) 0"><div class="sec-lista">' +
      libros.map(filaLibro).join("") + "</div></div>"
    : "";
  return estante +
    '<div style="padding:14px clamp(14px,3vw,22px) 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
    '<div style="' + CAJA_BUSCA + '">' + LUPA +
    '<input id="doc-q" type="search" placeholder="Filtrar — p. ej. 2023, extraordinaria…" aria-label="Filtrar exámenes" autocomplete="off" style="flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--tinta);font-family:inherit;font-size:16px;padding:10px 0"></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap">' + chips + "</div></div>" +
    '<div id="doc-resumen" class="anot" style="padding:14px clamp(14px,3vw,22px) 0"></div>' +
    '<div id="doc-lista" style="flex:1;overflow:auto;padding:8px clamp(14px,3vw,22px) 24px"></div>';
}

/* Todas las palabras de la consulta deben aparecer, en cualquier orden:
   "latín extraordinaria 2019" y "2019 latín extraordinaria" dan lo mismo. */
function terminos(q) {
  return norm(String(q || "").trim()).split(/\s+/).filter(Boolean);
}
function casa(texto, ts) {
  for (var i = 0; i < ts.length; i++) if (texto.indexOf(ts[i]) === -1) return false;
  return true;
}

function docsFiltrados(p) {
  var lista = (IDX.porAsig[p.titulo] || []);
  var ts = terminos(p.q);
  return lista.filter(function (d) {
    if (p.tipo !== "Todos" && d.tipo !== p.tipo) return false;
    return !ts.length || casa(d.busca, ts);
  });
}

function filaDoc(d) {
  /* "Modelo · Modelo" sobra: cuando convocatoria y tipo coinciden, basta uno. */
  var detalle = (d.conv === d.tipo ? d.tipo : d.conv + " · " + d.tipo) + (d.matiz ? " · " + d.matiz : "");
  return '<a class="h-fila" href="https://drive.google.com/file/d/' + esc(d.id) + '/view" target="_blank" rel="noopener" style="' +
    FILA + ';text-decoration:none">' +
    '<span class="doc-anio">' + d.anio + "</span>" +
    "<span>" + esc(detalle) + "</span>" + PUNTOS +
    '<span class="doc-tag">PDF</span></a>';
}

function pintarDocs() {
  var p = S.panel;
  if (!p || p.modo !== "docs") return;
  var lista = docsFiltrados(p);
  var total = (IDX.porAsig[p.titulo] || []).length;
  var res = host.querySelector("#doc-resumen");
  var cont = host.querySelector("#doc-lista");
  if (res) res.textContent = lista.length + " de " + total + " documentos";
  if (cont) {
    cont.className = p.recienAbierto ? "entra" : "";
    p.recienAbierto = false;
  }
  if (cont) cont.innerHTML = lista.length
    ? lista.map(filaDoc).join("")
    : '<p style="font-style:italic;color:var(--sut);padding:20px 4px">Ningún documento coincide con el filtro.</p>';
  [].forEach.call(host.querySelectorAll("[data-tipo]"), function (b) {
    b.setAttribute("style", btn(p.tipo === b.dataset.tipo));
  });
}

function abrirPanel(kicker, titulo, id, origen) {
  var conDocs = !!(IDX && IDX.porAsig[titulo]);
  S.panel = { kicker: kicker, titulo: titulo, id: id, cargado: false,
              modo: conDocs ? "docs" : "carpeta", q: "", tipo: "Todos", recienAbierto: true };
  ultimoFoco = origen || document.activeElement;
  pintarPanel();
  document.addEventListener("keydown", teclaPanel, true);

  /* Si el índice aún venía de camino, al llegar se cambia a la lista. */
  if (!conDocs && idxEstado !== "error") {
    cargarIndice(function () {
      if (!S.panel || S.panel.titulo !== titulo || S.panel.modo === "docs") return;
      if (!(IDX && IDX.porAsig[titulo])) return;
      S.panel.modo = "docs";
      pintarPanel();
    });
  }
}

function pintarPanel() {
  var p = S.panel;
  host.innerHTML = htmlPanel(p);
  /* Cierra solo si el clic cae en el telón. Comparar el objetivo en vez de
     cortar la propagación deja pasar los eventos delegados del cajón. */
  host.querySelector("[data-telon]").addEventListener("click", function (ev) {
    if (ev.target === ev.currentTarget) cerrarPanel();
  });
  host.querySelector("[data-cerrar]").addEventListener("click", cerrarPanel);

  var marco = host.querySelector("iframe");
  if (marco) {
    marco.addEventListener("load", function () {
      if (!S.panel) return;
      S.panel.cargado = true;
      marco.style.opacity = "1";
    });
  }
  if (p.modo === "docs") pintarDocs();
  host.querySelector("[data-cerrar]").focus();
}

function cerrarPanel() {
  if (!S.panel) return;
  S.panel = null;
  document.removeEventListener("keydown", teclaPanel, true);
  host.innerHTML = "";
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
  ultimoFoco = null;
}

function teclaPanel(ev) {
  if (!S.panel) return;
  if (ev.key === "Escape" || ev.key === "Esc") { ev.preventDefault(); cerrarPanel(); return; }
  if (ev.key !== "Tab") return;
  var f = [].slice.call(host.querySelectorAll('a[href],button,iframe'));
  if (!f.length) return;
  var primero = f[0], ultimo = f[f.length - 1], act = document.activeElement;
  var dentro = host.contains(act);
  if (ev.shiftKey && (act === primero || !dentro)) { ev.preventDefault(); ultimo.focus(); }
  else if (!ev.shiftKey && (act === ultimo || !dentro)) { ev.preventDefault(); primero.focus(); }
}

/* ---------------------------------------------------------------- eventos -- */

vista.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("button") : null;
  if (!b || !vista.contains(b)) return;
  if (b.dataset.id !== undefined) { abrirPanel(b.dataset.k, b.dataset.t, b.dataset.id, b); return; }
  if (b.dataset.asig) { alternarAsignatura(b.dataset.asig); return; }
  if (b.dataset.abrir) { irAAsignatura(b.dataset.abrir); return; }
  if (b.dataset.ir) { ir(b.dataset.ir); return; }
  if (b.dataset.nivel) { S.nivel = b.dataset.nivel; renderCursos(); return; }
  if (b.dataset.orden) { S.orden = b.dataset.orden; renderPau(); return; }
});

vista.addEventListener("input", function (ev) {
  if (ev.target.id === "pau-q") { S.qPau = ev.target.value; renderPau(); }
});

host.addEventListener("input", function (ev) {
  if (ev.target.id !== "doc-q" || !S.panel) return;
  S.panel.q = ev.target.value;
  pintarDocs();
});

host.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("[data-tipo]") : null;
  if (!b || !S.panel) return;
  S.panel.tipo = b.dataset.tipo;
  pintarDocs();
});

pestanas.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("[data-ir]") : null;
  if (b) ir(b.dataset.ir);
});

buscador.addEventListener("input", function () {
  S.q = buscador.value;
  actualizarPestanas();
  render();
});

botonTema.addEventListener("click", function () {
  S.tema = S.tema === "oscuro" ? "claro" : "oscuro";
  aplicarTema();
  try { localStorage.setItem("apuntes-tema", S.tema); } catch (e) {}
});

function aplicarTema() {
  document.documentElement.setAttribute("data-tema", S.tema);
  document.getElementById("tema-icono").textContent = S.tema === "oscuro" ? "☀" : "☾";
  document.getElementById("tema-label").textContent = S.tema === "oscuro" ? "Claro" : "Oscuro";
}

window.addEventListener("scroll", function () {
  var d = window.scrollY > 6;
  if (d === S.desplazado) return;
  S.desplazado = d;
  cabecera.classList.toggle("desplazado", d);
}, { passive: true });

/* ---------------------------------------------------------------- arranque -- */

S.tema = document.documentElement.getAttribute("data-tema") === "oscuro" ? "oscuro" : "claro";
aplicarTema();

ASIGNATURAS.forEach(function (a) {
  SECCIONES_DOC.forEach(function (s) {
    docsDe(a, s[0]).forEach(function (d) {
      DOC_INDICE.push({ a: a, sec: s[1], d: d,
                        busca: norm(a.nombre + " " + a.curso + " " + s[1] + " " + d[0]) });
    });
  });
});

if (window.IntersectionObserver) {
  obs = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("rev-on"); obs.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px" });
}

window.addEventListener("popstate", desdeHistorial);
window.addEventListener("hashchange", desdeHistorial);

/* La regla se mide en píxeles, así que hay que recolocarla cuando cambia el
   ancho o cuando entra la tipografía y las pestañas cambian de tamaño. */
window.addEventListener("resize", function () { moverSubrayado(true); });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { moverSubrayado(true); });
}

var rutaInicial = rutaDeHash();
if (rutaInicial.tab) {
  S.tab = rutaInicial.tab;
  if (rutaInicial.asig) S.abiertas[rutaInicial.asig] = 1;
  /* Normaliza las anclas antiguas (#fisica-y-quimica → #fyq) sin añadir historial. */
  var canonico = hashDe(rutaInicial.tab, rutaInicial.asig);
  if ((location.hash || "") !== canonico) {
    try { history.replaceState(null, "", location.pathname + location.search + canonico); } catch (e) {}
  }
}

pintarPestanas();
render({ animarStats: true });

/* El índice llega en segundo plano. Si al aterrizar hay una búsqueda abierta o
   una asignatura de 2º de Bachillerato desplegada, se repinta para que
   aparezcan también los exámenes de la PAU. En Selectivos basta con rellenar
   el estante de libros: repintar la vista entera le quitaría el foco al
   filtro. */
cargarIndice(function () {
  if (idxEstado !== "listo") return;
  if (norm(S.q.trim())) { render(); return; }
  if (MATERIAS[S.tab]) { renderCursos(); return; }
  if (S.tab === "pau") {
    var estante = document.getElementById("pau-libros");
    if (estante) estante.innerHTML = bloqueLibros();
  }
});
})();
</script>
</body>
</html>
