    '<span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sut)">' + esc(curso.datos) + "</span>" +
    '<span style="font-size:14px;line-height:1.5;flex:1;text-wrap:pretty">' + esc(curso.nota) + "</span>" +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">' + enlacesDe(curso, materia) + "</div>" +
    "</div>";
}

function filaPau(p, conEtiqueta) {
  var marca = conEtiqueta
    ? '<span style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);flex:none">PAU</span>'
    : '<span style="display:inline-block;width:.5em;height:.5em;flex:none;background:' + (p[3] ? "var(--acc)" : "transparent") +
      ";border:1px solid " + (p[3] ? "var(--acc)" : "transparent") + '"></span>';
  return '<button class="h-fila" ' + abridor("PAU · Comunitat Valenciana", p[0], p[2]) + ' style="' + FILA + '">' +
    marca + "<span>" + esc(p[0]) + "</span>" + PUNTOS +
    '<span style="font-size:12px;color:var(--sut);flex:none">' + p[1] + " PDF</span></button>";
}

function vistaInicio() {
  var stats = ESTADISTICAS.map(function (s, i) {
    var cifra = s.texto !== undefined
      ? esc(s.texto)
      : '<span data-stat="' + s.valor + '">0</span>';
    return '<div class="rev" style="background:var(--pg);padding:18px 16px;' + retardo(i) + '">' +
      '<div style="font-weight:800;font-size:clamp(26px,4vw,38px);letter-spacing:-.03em;line-height:1">' + cifra + "</div>" +
      '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sut);margin-top:6px">' + esc(s.label) + "</div></div>";
  }).join("");

  var secciones = SECCIONES.map(function (s, i) {
    return '<button class="rev h-sec" data-ir="' + s.destino + '" style="text-align:left;border:2px solid var(--rule);background:var(--sup);color:var(--ink);font-family:inherit;padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;' + retardo(i) + '">' +
      '<span style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)">' + esc(s.kicker) + "</span>" +
      '<span style="font-weight:800;font-size:21px;letter-spacing:-.015em">' + esc(s.titulo) + "</span>" +
      '<span style="font-size:13px;color:var(--sut);line-height:1.5">' + esc(s.detalle) + "</span></button>";
  }).join("");

  var ayuda = [
    ["Elige asignatura arriba", "Cada pestaña reúne los cursos de una materia; el buscador cubre cursos y PAU a la vez."],
    ["Abre la carpeta sin salir", "Los apuntes y exámenes se muestran embebidos desde Google Drive: puedes verlos o descargarlos."],
    ["Practica con la PAU", "Convocatorias 2010–2026 de las 40 asignaturas, con examen y criterios de corrección."]
  ].map(function (a) {
    return '<div class="rev"><p style="font-weight:600;margin:0 0 6px">' + esc(a[0]) + "</p>" +
      '<p style="color:var(--sut);margin:0;line-height:1.55">' + esc(a[1]) + "</p></div>";
  }).join("");

  return "<section>" +
    '<p class="rev" style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sut);margin:0">Física y Química · Matemáticas · Biología</p>' +
    '<h1 class="rev" style="font-size:clamp(52px,11vw,116px);font-weight:800;letter-spacing:-.035em;line-height:.92;margin:14px 0 0">Apuntes</h1>' +
    '<hr style="height:2px;border:0;background:var(--fuerte);margin:22px 0 0">' +
    '<p class="rev" style="max-width:52ch;font-size:clamp(16px,2vw,19px);line-height:1.5;margin:22px 0 0;text-wrap:pretty">Materiales de clase y bancos de exámenes, de 2º de ESO a 2º de Bachillerato, y el archivo completo de la PAU valenciana.</p>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--rule);border:2px solid var(--fuerte);margin-top:36px">' + stats + "</div>" +
    '<h2 style="font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em;margin:56px 0 0">Secciones</h2>' +
    '<hr style="height:2px;border:0;background:var(--fuerte);margin:14px 0 0">' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:22px">' + secciones + "</div>" +
    '<h2 style="font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em;margin:56px 0 0">Cómo usar esta web</h2>' +
    '<hr style="height:2px;border:0;background:var(--fuerte);margin:14px 0 0">' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:22px">' + ayuda + "</div>" +
    '<div style="border:2px solid var(--rule);padding:18px 20px;margin-top:40px">' +
    '<p style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0 0 6px">Calendarios</p>' +
    '<p style="margin:0;color:var(--sut)">Las fechas de exámenes y entregas se activarán al inicio del curso 2026-27. El resto de secciones están operativas.</p></div>' +
    "</section>";
}

function cursosVisibles(m) {
  return m.cursos.filter(function (c) { return S.nivel === "todos" || c.nivel === S.nivel; });
}

function gridCursos(m) {
  return cursosVisibles(m).map(function (c, i) { return tarjetaCurso(c, m.titulo, i); }).join("");
}

function vistaMateria(m) {
  var filtros = FILTROS.map(function (f) {
    return '<button class="tap" data-nivel="' + f[0] + '" style="' + btn(S.nivel === f[0]) + '">' + esc(f[1]) + "</button>";
  }).join("");
  var nota = m.preparacion
    ? '<p style="font-style:italic;color:var(--sut);border-top:1px solid var(--rule);margin-top:28px;padding-top:16px">' + esc(m.preparacion) + "</p>"
    : "";
  return "<section>" +
    '<p style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sut);margin:0">' + esc(m.kicker) + "</p>" +
    '<h2 style="font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:10px 0 0">' + esc(m.titulo) + "</h2>" +
    REGLA +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px">' + filtros + "</div>" +
    '<div id="cursos-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px">' + gridCursos(m) + "</div>" +
    nota + "</section>";
}

function listaPau() {
  var q = norm(S.qPau.trim());
  var lista = PAU.filter(function (p) { return norm(p[0]).indexOf(q) !== -1; });
  if (S.orden === "az") lista = lista.slice().sort(function (a, b) { return a[0].localeCompare(b[0], "es"); });
  return lista;
}

function cuerpoPau(lista) {
  var filas = '<div style="margin-top:8px">' + lista.map(function (p) { return filaPau(p, false); }).join("") + "</div>";
  var vacio = lista.length === 0
    ? '<p style="font-style:italic;color:var(--sut);padding:20px 4px">Ninguna asignatura coincide con el filtro.</p>'
    : "";
  return filas + vacio;
}

function vistaPau() {
  var lista = listaPau();
  var ordenes = ORDENES.map(function (o) {
    return '<button class="tap" data-orden="' + o[0] + '" style="' + ordenEstilo(S.orden === o[0]) + '">' + esc(o[1]) + "</button>";
  }).join("");
  return "<section>" +
    '<p style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sut);margin:0">Parte 4</p>' +
    '<h2 style="font-size:clamp(30px,6vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:10px 0 0">Selectivos — PAU Comunitat Valenciana</h2>' +
    REGLA +
    '<p style="max-width:62ch;margin:20px 0 0;text-wrap:pretty">Archivo completo de la PAU valenciana: las 40 asignaturas, convocatorias 2010–2026 (ordinaria, extraordinaria y modelos), cada una con examen y criterios de corrección. Fuente: <a href="https://universitats.gva.es/es/proves-acces-universitat" target="_blank" rel="noopener">universitats.gva.es</a>.</p>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px">' +
    '<div style="' + CAJA_BUSCA + '">' + LUPA +
    '<input id="pau-q" type="search" value="' + esc(S.qPau) + '" placeholder="Filtrar asignatura — p. ej. física, latín, dibujo…" aria-label="Filtrar asignatura PAU" autocomplete="off" style="flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;padding:10px 0"></div>' +
    '<div style="display:flex;gap:0;border:2px solid var(--rule)">' + ordenes + "</div></div>" +
    '<p id="pau-resumen" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sut);margin:16px 0 0">' + lista.length + " de 40 asignaturas · examen + criterios + modelo</p>" +
    '<div id="pau-cuerpo">' + cuerpoPau(lista) + "</div></section>";
}

function vistaBusqueda(gq) {
  var resCursos = [];
  Object.keys(MATERIAS).forEach(function (k) {
    var mat = MATERIAS[k];
    mat.cursos.forEach(function (c) {
      if (norm(mat.titulo + " " + c.nombre + " " + c.nota).indexOf(gq) !== -1) resCursos.push({ materia: mat.titulo, curso: c });
    });
  });
  var resPau = PAU.filter(function (p) { return norm(p[0]).indexOf(gq) !== -1; });
  var total = resCursos.length + resPau.length;

  var tarjetas = resCursos.map(function (r) {
    return '<div class="h-card" style="' + TARJETA + ';padding:18px;gap:10px">' +
      '<span style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)">' + esc(r.materia) + "</span>" +
      '<span style="font-weight:800;font-size:19px;letter-spacing:-.01em">' + esc(r.curso.nombre) + "</span>" +
      '<span style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sut)">' + esc(r.curso.datos) + "</span>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">' + enlacesDe(r.curso, r.materia) + "</div></div>";
  }).join("");

  var filas = resPau.map(function (p) { return filaPau(p, true); }).join("");
  var vacio = total === 0
    ? '<p style="font-style:italic;color:var(--sut);padding:24px 0">Nada coincide con la búsqueda.</p>'
    : "";
  var resumen = total + (total === 1 ? " coincidencia" : " coincidencias") + " para «" + S.q.trim() + "»";

  return "<section>" +
    '<p style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sut);margin:0 0 8px">Resultados</p>' +
    '<h2 style="font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;margin:0">' + esc(resumen) + "</h2>" +
    REGLA +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px">' + tarjetas + "</div>" +
    '<div style="margin-top:28px">' + filas + "</div>" + vacio + "</section>";
}

/* ------------------------------------------------------------ renderizado -- */

var vista = document.getElementById("vista");
var pestanas = document.getElementById("pestanas");
var buscador = document.getElementById("buscador");
var cabecera = document.getElementById("cabecera");
var host = document.getElementById("panel-host");
var botonTema = document.getElementById("tema");

var ultimaClave = null;
var obs = null;
var raf = 0;
var ultimoFoco = null;

function claveVista() {
  if (norm(S.q.trim())) return "busqueda";
  if (MATERIAS[S.tab]) return "materia:" + S.tab;
  if (S.tab === "pau") return "pau";
  return "inicio";
}

function html() {
  var gq = norm(S.q.trim());
  if (gq) return vistaBusqueda(gq);
  var m = MATERIAS[S.tab];
  if (m) return vistaMateria(m);
  if (S.tab === "pau") return vistaPau();
  return vistaInicio();
}

function render(opts) {
  opts = opts || {};
  var clave = claveVista();
  var nueva = clave !== ultimaClave;
  ultimaClave = clave;
  vista.innerHTML = html();
  vista.classList.remove("pane");
  if (nueva) { void vista.offsetWidth; vista.classList.add("pane"); }
  if (clave === "inicio") pintarStats(opts.animarStats === true);
  reobservar();
}

function pintarPestanas() {
  pestanas.innerHTML = PESTANAS.map(function (t) {
    return '<button data-ir="' + t[0] + '" style="' + tabEstilo(S.tab === t[0] && !S.q) + '">' + esc(t[1]) + "</button>";
  }).join("");
}
function actualizarPestanas() {
  var b = pestanas.querySelectorAll("[data-ir]");
  for (var i = 0; i < b.length; i++) b[i].setAttribute("style", tabEstilo(S.tab === b[i].dataset.ir && !S.q));
}

function pintarStats(animar) {
  cancelAnimationFrame(raf);
  var nodos = [].slice.call(document.querySelectorAll("[data-stat]"));
  if (!nodos.length) return;
  var finales = nodos.map(function (n) { return +n.dataset.stat; });
  if (!animar || menosMovimiento()) {
    nodos.forEach(function (n, i) { n.textContent = String(finales[i]); });
    return;
  }
  var t0 = performance.now(), dur = 950;
  var paso = function (ahora) {
    var t = Math.min(1, (ahora - t0) / dur);
    var f = 1 - Math.pow(1 - t, 3);
    nodos.forEach(function (n, i) { n.textContent = String(Math.round(finales[i] * f)); });
    if (t < 1) raf = requestAnimationFrame(paso);
  };
  raf = requestAnimationFrame(paso);
}

function reobservar() {
  if (!obs) {
    [].forEach.call(document.querySelectorAll(".rev"), function (n) { n.classList.add("rev-on"); });
    return;
  }
  requestAnimationFrame(function () {
    [].forEach.call(document.querySelectorAll(".rev:not(.rev-on)"), function (n) { obs.observe(n); });
  });
}

function ir(tab) {
  S.tab = tab;
  S.q = "";
  buscador.value = "";
  actualizarPestanas();
  render({ animarStats: tab === "inicio" });
  window.scrollTo({ top: 0, behavior: menosMovimiento() ? "auto" : "smooth" });
}

function renderCursos() {
  var m = MATERIAS[S.tab];
  if (!m) return;
  var grid = document.getElementById("cursos-grid");
  if (grid) grid.innerHTML = gridCursos(m);
  [].forEach.call(vista.querySelectorAll("[data-nivel]"), function (b) {
    b.setAttribute("style", btn(S.nivel === b.dataset.nivel));
  });
  reobservar();
}

function renderPau() {
  var lista = listaPau();
  var resumen = document.getElementById("pau-resumen");
  var cuerpo = document.getElementById("pau-cuerpo");
  if (resumen) resumen.textContent = lista.length + " de 40 asignaturas · examen + criterios + modelo";
  if (cuerpo) cuerpo.innerHTML = cuerpoPau(lista);
  [].forEach.call(vista.querySelectorAll("[data-orden]"), function (b) {
    b.setAttribute("style", ordenEstilo(S.orden === b.dataset.orden));
  });
}

/* ----------------------------------------------------------------- panel -- */

function htmlPanel(p) {
  return '<div class="telon" data-telon style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end">' +
    '<div class="cajon" role="dialog" aria-modal="true" aria-label="' + esc(p.titulo) + '" style="width:min(780px,100%);height:100%;background:var(--pg);border-left:2px solid var(--fuerte);display:flex;flex-direction:column">' +
    '<div style="display:flex;align-items:center;gap:12px;padding:14px clamp(14px,3vw,22px);border-bottom:2px solid var(--fuerte)">' +
    '<div style="margin-right:auto;min-width:0">' +
    '<div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.kicker) + "</div>" +
    '<div style="font-weight:800;font-size:19px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.titulo) + "</div></div>" +
    '<a class="h-acc" href="' + esc(D(p.id)) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;border:2px solid var(--rule);color:var(--ink);text-decoration:none;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;flex:none">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"></path></svg><span>Drive</span></a>' +
    '<button class="h-acc" data-cerrar aria-label="Cerrar" style="border:2px solid var(--rule);background:transparent;color:var(--ink);width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>' +
    '<div style="flex:1;position:relative;background:var(--sup)">' +
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sut);font-size:12px;letter-spacing:.16em;text-transform:uppercase">Cargando carpeta…</div>' +
    '<iframe src="' + esc(EMB(p.id)) + '" title="Carpeta de Google Drive" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;transition:opacity .4s ease;opacity:0"></iframe>' +
    "</div></div></div>";
}

function abrirPanel(kicker, titulo, id, origen) {
  S.panel = { kicker: kicker, titulo: titulo, id: id, cargado: false };
  ultimoFoco = origen || document.activeElement;
  host.innerHTML = htmlPanel(S.panel);

  host.querySelector("[data-telon]").addEventListener("click", cerrarPanel);
  host.querySelector(".cajon").addEventListener("click", function (ev) { ev.stopPropagation(); });
  host.querySelector("[data-cerrar]").addEventListener("click", cerrarPanel);

  var marco = host.querySelector("iframe");
  marco.addEventListener("load", function () {
    if (!S.panel) return;
    S.panel.cargado = true;
    marco.style.opacity = "1";
  });

  document.addEventListener("keydown", teclaPanel, true);
  host.querySelector("[data-cerrar]").focus();
}

function cerrarPanel() {
  if (!S.panel) return;
  S.panel = null;
  document.removeEventListener("keydown", teclaPanel, true);
  host.innerHTML = "";
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
  ultimoFoco = null;
}

function teclaPanel(ev) {
  if (!S.panel) return;
  if (ev.key === "Escape" || ev.key === "Esc") { ev.preventDefault(); cerrarPanel(); return; }
  if (ev.key !== "Tab") return;
  var f = [].slice.call(host.querySelectorAll('a[href],button,iframe'));
  if (!f.length) return;
  var primero = f[0], ultimo = f[f.length - 1], act = document.activeElement;
  var dentro = host.contains(act);
  if (ev.shiftKey && (act === primero || !dentro)) { ev.preventDefault(); ultimo.focus(); }
  else if (!ev.shiftKey && (act === ultimo || !dentro)) { ev.preventDefault(); primero.focus(); }
}

/* ---------------------------------------------------------------- eventos -- */

vista.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("button") : null;
  if (!b || !vista.contains(b)) return;
  if (b.dataset.id !== undefined) { abrirPanel(b.dataset.k, b.dataset.t, b.dataset.id, b); return; }
  if (b.dataset.ir) { ir(b.dataset.ir); return; }
  if (b.dataset.nivel) { S.nivel = b.dataset.nivel; renderCursos(); return; }
  if (b.dataset.orden) { S.orden = b.dataset.orden; renderPau(); return; }
});

vista.addEventListener("input", function (ev) {
  if (ev.target.id === "pau-q") { S.qPau = ev.target.value; renderPau(); }
});

pestanas.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("[data-ir]") : null;
  if (b) ir(b.dataset.ir);
});

buscador.addEventListener("input", function () {
  S.q = buscador.value;
  actualizarPestanas();
  render();
});

botonTema.addEventListener("click", function () {
  S.tema = S.tema === "oscuro" ? "claro" : "oscuro";
  aplicarTema();
  try { localStorage.setItem("apuntes-tema", S.tema); } catch (e) {}
});

function aplicarTema() {
  document.documentElement.setAttribute("data-tema", S.tema);
  document.getElementById("tema-icono").textContent = S.tema === "oscuro" ? "☀" : "☾";
  document.getElementById("tema-label").textContent = S.tema === "oscuro" ? "Claro" : "Oscuro";
}

window.addEventListener("scroll", function () {
  var d = window.scrollY > 6;
  if (d === S.desplazado) return;
  S.desplazado = d;
  cabecera.classList.toggle("desplazado", d);
}, { passive: true });

/* ---------------------------------------------------------------- arranque -- */

S.tema = document.documentElement.getAttribute("data-tema") === "oscuro" ? "oscuro" : "claro";
aplicarTema();

if (window.IntersectionObserver) {
  obs = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("rev-on"); obs.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px" });
}

pintarPestanas();
render({ animarStats: true });
})();
</script>
</body>
</html>
